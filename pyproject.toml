[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "wexa-graph-db-benchmark"
version = "0.1.0"
description = "Reproducible graph database benchmark for the Wexa AI take-home assessment"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [{name = "Ahmed Yasser Morra"}]
dependencies = [
  "falkordb==1.7.1",
  "httpx==0.28.1",
  "neo4j==6.2.0",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
  "pyright==1.1.411",
  "pytest==9.1.1",
  "pytest-cov==7.0.0",
  "ruff==0.16.4",
]

[project.scripts]
wexa-bench = "wexa_benchmark.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wexa_benchmark"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
